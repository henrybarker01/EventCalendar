services:
  api:
    build: .
    restart: unless-stopped
    volumes:
      - ./data:/data
    expose:
      - "8000"
    # No Caddy of our own: the server's shared Caddy (AeroMechUI project, which owns
    # ports 80/443) reverse-proxies calendar.aeromech.co to us over its network.
    networks:
      default:
      aeromechui:
        aliases:
          - eventview-api

  scraper:
    build: .
    restart: unless-stopped
    # --init-db is idempotent (safe to re-run) and guards against the scraper
    # container winning the race to touch the DB before the api container does.
    command: ["sh", "-c", "python main.py --init-db && python main.py --schedule"]
    volumes:
      - ./data:/data

networks:
  aeromechui:
    external: true
    name: aeromechui_default
